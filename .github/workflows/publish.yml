name: Publish application artifacts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: artifacts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ATLAS_NO_ANON_TELEMETRY: 'true'
  ATLAS_NO_UPDATE_NOTIFIER: 'true'
  APPLICATION_CHART_REVISION: 25e44b5db329e86c1901e94a6f659cbe298f7b24 # pipeline chart PR37; merge shared dependency first

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      revision: ${{ steps.source.outputs.revision }}
      tag: ${{ steps.source.outputs.tag }}
      publish: ${{ steps.source.outputs.publish }}

    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PUBLISH: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Select exact source and artifact tag
        id: source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ && "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]] || exit 1
          tag=commit-$SOURCE_SHA
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || exit 1
            tag=preview-pr-$PR_NUMBER-$SOURCE_SHA
          fi
          echo "revision=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

  validate:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.source.outputs.revision }}
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: python -m pip install -r backend/requirements.txt

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ai-platform-portfolio/application-helm-chart
          ref: ${{ env.APPLICATION_CHART_REVISION }}
          path: .application-chart
          persist-credentials: false

      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v3.22.1

      - run: python -m pip install PyYAML==6.0.3

      - name: Test release mapping and actual chart package
        env:
          APPLICATION_CHART: .application-chart
        run: python -B -m unittest discover -s tests -p 'test_publication.py' -v

      - name: Require Atlas bot for trusted publication
        if: needs.source.outputs.publish == 'true'
        env:
          ATLAS_CLOUD_TOKEN: ${{ secrets.ATLAS_CLOUD_TOKEN }}
        run: test -n "$ATLAS_CLOUD_TOKEN" || { echo '::error::ATLAS_CLOUD_TOKEN is required for trusted validation and publication.'; exit 1; }

      - uses: ariga/setup-atlas@2f3c785c89a15e1c0d07bcae3900fb5feb969eea
        with:
          version: v1.3.6
          cloud-token: ${{ needs.source.outputs.publish == 'true' && secrets.ATLAS_CLOUD_TOKEN || '' }}

      - name: Validate checksum and replay
        uses: ai-platform-portfolio/ops-shared/.github/actions/atlas-validate@eddfe0cc46d5a2d60cb9b576d635f1d33aa8d9dc
        with:
          environment: local
          dev-url: docker://postgres/18.6/dev?search_path=public

      - name: Evaluate deterministic extraction and consistency cases
        run: python -B -m unittest discover -s tests -p 'test_processing.py' -v

      - name: Run real HTTP and restricted SQL acceptance
        run: python tests/integration.py

      - name: Lint the complete migration directory
        if: needs.source.outputs.publish == 'true'
        run: atlas migrate lint --config file://atlas.ci.hcl --env ci --latest "$(find migrations -name '*.sql' -type f | wc -l | tr -d ' ')"

      - name: Test migration constraints
        if: needs.source.outputs.publish == 'true'
        uses: ariga/atlas-action/migrate/test@be526fa360e6cb745546681470f4760dbbc49cf8
        with:
          config: file://atlas.ci.hcl
          env: ci

  api:
    needs: [source, validate]
    permissions:
      contents: read
      id-token: write

    uses: ai-platform-portfolio/ops-shared/.github/workflows/docker.yml@eddfe0cc46d5a2d60cb9b576d635f1d33aa8d9dc
    with:
      image: portfolio/financial-document-consistency
      context: backend
      revision: ${{ needs.source.outputs.revision }}
      tag: ${{ needs.source.outputs.tag }}
      publish-preview: true
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  migrations:
    needs: [source, validate]
    if: needs.source.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    outputs:
      revision: ${{ steps.record.outputs.revision }}
      checksum: ${{ steps.record.outputs.checksum }}

    env:
      SOURCE_SHA: ${{ needs.source.outputs.revision }}
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Require current trusted source before publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ && "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]] || exit 1
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" |
              jq -e --arg sha "$SOURCE_SHA" --arg repo "$GITHUB_REPOSITORY" \
                '.state == "open" and .head.sha == $sha and .head.repo.full_name == $repo' >/dev/null
          else
            [[ "$GITHUB_REF" == refs/heads/main ]] || exit 1
            [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" == "$SOURCE_SHA" ]] || exit 1
          fi

      - uses: ariga/setup-atlas@2f3c785c89a15e1c0d07bcae3900fb5feb969eea
        with:
          version: v1.3.6
          cloud-token: ${{ secrets.ATLAS_CLOUD_TOKEN }}

      - name: Ensure the application migration repository
        uses: ai-platform-portfolio/ops-shared/.github/actions/atlas-repository@eddfe0cc46d5a2d60cb9b576d635f1d33aa8d9dc
        with:
          name: financial-document-consistency
          type: migration_directory
          driver: postgres

      - name: Publish source-tagged migrations
        uses: ariga/atlas-action/migrate/push@be526fa360e6cb745546681470f4760dbbc49cf8
        with:
          config: file://atlas.ci.hcl
          env: ci
          dir-name: financial-document-consistency
          tag: ${{ env.SOURCE_SHA }}
          latest: ${{ github.event_name != 'pull_request' }}

      - name: Record published migration identity
        id: record
        run: |
          set -euo pipefail
          git diff --exit-code -- migrations
          echo "revision=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "checksum=$(sha256sum migrations/atlas.sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

  artifacts:
    needs: [source, api, migrations]
    if: needs.source.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      pull-requests: read
      id-token: write

    env:
      SOURCE_SHA: ${{ needs.source.outputs.revision }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      API_IMAGE: ${{ needs.api.outputs.image }}
      API_DIGEST: ${{ needs.api.outputs.digest }}
      API_REVISION: ${{ needs.api.outputs.revision }}
      MIGRATION_REVISION: ${{ needs.migrations.outputs.revision }}
      MIGRATION_CHECKSUM: ${{ needs.migrations.outputs.checksum }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Verify and record the complete matching artifact set
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ && "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]] || exit 1
          [[ "$API_REVISION" == "$SOURCE_SHA" && "$MIGRATION_REVISION" == "$SOURCE_SHA" ]] || exit 1
          [[ "$API_IMAGE" =~ ^localacrk8s\.azurecr\.io/portfolio/financial-document-consistency:[a-z0-9_][a-z0-9_.-]{0,127}$ ]] || exit 1
          [[ "$API_DIGEST" =~ ^sha256:[a-f0-9]{64}$ && "$MIGRATION_CHECKSUM" =~ ^[a-f0-9]{64}$ ]] || exit 1
          [[ "$(sha256sum migrations/atlas.sum | cut -d ' ' -f 1)" == "$MIGRATION_CHECKSUM" ]] || exit 1
          jq -n --arg repo "$GITHUB_REPOSITORY" --arg sha "$SOURCE_SHA" \
            --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" \
            --arg workflow "$GITHUB_WORKFLOW_REF" --arg event "$GITHUB_EVENT_NAME" \
            --arg image "$API_IMAGE" --arg digest "$API_DIGEST" \
            --arg reference "${API_IMAGE%:*}@$API_DIGEST" --arg checksum "$MIGRATION_CHECKSUM" \
            '{source: {repository: $repo, revision: $sha},
              workflow: {runId: $run, attempt: $attempt, workflowRef: $workflow, event: $event},
              images: {api: {tag: $image, digest: $digest, reference: $reference}},
              migrations: {repository: "financial-document-consistency", tag: $sha,
                url: ("atlas://financial-document-consistency?tag=" + $sha), atlasSumSha256: $checksum}}' \
            > artifacts.json

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ai-platform-portfolio/application-helm-chart
          ref: ${{ env.APPLICATION_CHART_REVISION }}
          path: .application-chart
          persist-credentials: false

      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v3.22.1

      - run: python3 -m pip install PyYAML==6.0.3

      - name: Generate this application's release values
        id: values
        run: python3 scripts/write-release-values.py

      - uses: ai-platform-portfolio/ops-shared/.github/actions/acr-helm-login@eddfe0cc46d5a2d60cb9b576d635f1d33aa8d9dc
        with:
          registry: localacrk8s
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: ariga/setup-atlas@2f3c785c89a15e1c0d07bcae3900fb5feb969eea
        with:
          version: v1.3.6
          cloud-token: ${{ secrets.ATLAS_CLOUD_TOKEN }}

      - name: Ensure the application's role-plan repository
        uses: ai-platform-portfolio/ops-shared/.github/actions/atlas-repository@eddfe0cc46d5a2d60cb9b576d635f1d33aa8d9dc
        with:
          name: ${{ steps.values.outputs.role-repository }}
          type: schema
          driver: postgres

      - name: Reject stale source immediately before release publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" |
              jq -e --arg sha "$SOURCE_SHA" --arg repo "$GITHUB_REPOSITORY" \
                '.state == "open" and .head.sha == $sha and .head.repo.full_name == $repo' >/dev/null
          else
            [[ "$GITHUB_REF" == refs/heads/main ]] || exit 1
            [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" == "$SOURCE_SHA" ]] || exit 1
          fi

      - name: Publish the complete shared-chart release
        id: release
        uses: ai-platform-portfolio/ops-shared/.github/actions/publish-release@eddfe0cc46d5a2d60cb9b576d635f1d33aa8d9dc
        with:
          chart: .application-chart
          values: ${{ steps.values.outputs.values }}
          destination: ${{ steps.values.outputs.destination }}
          version: ${{ steps.values.outputs.version }}
          revision: ${{ env.SOURCE_SHA }}

      - name: Lock the published release against writes
        uses: ai-platform-portfolio/ops-shared/.github/actions/acr-lock@eddfe0cc46d5a2d60cb9b576d635f1d33aa8d9dc
        with:
          registry: localacrk8s
          reference: ${{ steps.release.outputs.reference }}

      - name: Record the published release identity
        env:
          RELEASE_REFERENCE: ${{ steps.release.outputs.reference }}
          RELEASE_DIGEST: ${{ steps.release.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || exit 1
          jq --arg reference "$RELEASE_REFERENCE" --arg digest "$RELEASE_DIGEST" \
            --arg chart "$APPLICATION_CHART_REVISION" \
            '.release = {reference: $reference, digest: $digest, chartRevision: $chart}' \
            artifacts.json > "$RUNNER_TEMP/artifacts.json"
          mv "$RUNNER_TEMP/artifacts.json" artifacts.json

      - name: Reject stale handoff immediately before upload
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" |
              jq -e --arg sha "$SOURCE_SHA" --arg repo "$GITHUB_REPOSITORY" \
                '.state == "open" and .head.sha == $sha and .head.repo.full_name == $repo' >/dev/null
          else
            [[ "$GITHUB_REF" == refs/heads/main ]] || exit 1
            [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" == "$SOURCE_SHA" ]] || exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: artifacts-${{ env.SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts.json
          if-no-files-found: error
          retention-days: 7
