# CI injects the same source-matching API/worker image and migration references.
name: financial-document-consistency
components:
  api:
    port: 8000
    healthPath: /api/healthz
    readinessPath: /api/readyz
    database: reviews
    storage: documents
    resources:
      limits:
        memory: 768Mi
  worker:
    command:
    - python
    - worker.py
    database: reviews
    storage: documents
    model: chat
    resources:
      limits:
        memory: 768Mi
    readinessProbe:
      exec:
        command:
        - python
        - worker.py
        - --health
      periodSeconds: 10
      initialDelaySeconds: 5
    livenessProbe:
      exec:
        command:
        - python
        - worker.py
        - --health
      periodSeconds: 10
      initialDelaySeconds: 20
databases:
  reviews:
    reclaimPolicy: delete
    runtimeAccess: readWrite
storage:
  documents:
    reclaimPolicy: delete
